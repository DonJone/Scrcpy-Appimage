name: Build and Release Scrcpy All-in-One (FFmpeg 60 + ADB)

on:
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新构建并覆盖发布'
        type: boolean
        default: true
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Latest Scrcpy Version
        id: get_version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/Genymobile/scrcpy/releases/latest | jq -r .tag_name)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check if Release Exists
        id: check_release
        run: |
          if [ "${{ github.event.inputs.force }}" == "true" ]; then
            echo "SKIP_BUILD=false" >> $GITHUB_ENV
          elif gh release view ${{ env.VERSION }} > /dev/null 2>&1; then
            echo "SKIP_BUILD=true" >> $GITHUB_ENV
          else
            echo "SKIP_BUILD=false" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        if: env.SKIP_BUILD == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg libsdl2-2.0-0 adb gcc git pkg-config meson ninja-build \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libavdevice-dev \
            libsdl2-dev libusb-1.0-0-dev python3-pip wget jq unzip

      - name: Clone and Prepare
        if: env.SKIP_BUILD == 'false'
        run: |
          git clone --depth 1 --branch ${{ env.VERSION }} https://github.com/Genymobile/scrcpy.git
          wget -O scrcpy-server "https://github.com/Genymobile/scrcpy/releases/download/${{ env.VERSION }}/scrcpy-server-${{ env.VERSION }}"
          
          # --- 🚀 核心：下载最新官方 ADB ---
          wget -O platform-tools.zip https://dl.google.com/android/repository/platform-tools-latest-linux.zip
          unzip platform-tools.zip
          # ------------------------------

      - name: Build Client
        if: env.SKIP_BUILD == 'false'
        run: |
          cd scrcpy
          meson setup build --buildtype=release --strip -Db_lto=true -Dcompile_server=false -Dprebuilt_server=../scrcpy-server
          ninja -C build

      - name: Create AppDir & Package
        if: env.SKIP_BUILD == 'false'
        run: |
          mkdir -p Scrcpy.AppDir/usr/bin
          
          # 1. 复制 Scrcpy 组件
          cp scrcpy/build/app/scrcpy Scrcpy.AppDir/usr/bin/
          cp scrcpy-server Scrcpy.AppDir/usr/bin/scrcpy-server
          cp scrcpy/app/data/icon.png Scrcpy.AppDir/scrcpy.png
          
          # 2. 复制最新 ADB 到 bin 目录
          cp platform-tools/adb Scrcpy.AppDir/usr/bin/adb
          chmod +x Scrcpy.AppDir/usr/bin/adb
          
          # 3. 创建桌面文件
          cat > Scrcpy.AppDir/scrcpy.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Scrcpy
          Exec=scrcpy.wrapper
          Icon=scrcpy
          Categories=Development;Utility;
          Terminal=false
          EOF

          # 4. 引导脚本：确保 AppImage 内部的 ADB 优先级最高
          cat > Scrcpy.AppDir/usr/bin/scrcpy.wrapper << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          # 让内部 bin 目录在 PATH 最前面，优先使用打包进去的 adb
          export PATH="$APPDIR/usr/bin:$PATH"
          export SCRCPY_SERVER_PATH="$APPDIR/usr/bin/scrcpy-server"
          export LD_LIBRARY_PATH="$APPDIR/usr/lib/x86_64-linux-gnu:$APPDIR/usr/lib:$LD_LIBRARY_PATH"
          exec "$APPDIR/usr/bin/scrcpy" "$@"
          EOF
          chmod +x Scrcpy.AppDir/usr/bin/scrcpy.wrapper

          # 5. 下载 linuxdeploy 并执行
          wget -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          export ARCH=x86_64
          export VERSION="${{ env.VERSION }}"
          
          ./linuxdeploy --appimage-extract
          ./squashfs-root/AppRun \
            --appdir Scrcpy.AppDir \
            --executable Scrcpy.AppDir/usr/bin/scrcpy \
            --executable Scrcpy.AppDir/usr/bin/adb \
            --desktop-file Scrcpy.AppDir/scrcpy.desktop \
            --icon-file Scrcpy.AppDir/scrcpy.png \
            --output appimage

      - name: Create GitHub Release
        if: env.SKIP_BUILD == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Scrcpy All-in-One ${{ env.VERSION }}"
          body: |
            ### 📦 全能自包含版说明
            - **内置 FFmpeg 6.0**: 兼容 Arch/CachyOS 等最新系统。
            - **内置官方最新 ADB**: 即使系统没装 `adb` 也能直接运行。
            - **SDL2 支持**: 自动处理依赖，并调用宿主机显卡驱动。
          files: "Scrcpy-*.AppImage"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Scrcpy AppImage

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg libsdl2-2.0-0 adb gcc git pkg-config meson ninja-build \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libsdl2-dev libusb-1.0-0-dev python3-pip wget jq

      - name: Get Latest Scrcpy Version
        id: get_version
        run: |
          # 自动获取最新 Tag (例如 v3.1)
          VERSION=$(curl -s https://api.github.com/repos/Genymobile/scrcpy/releases/latest | jq -r .tag_name)
          echo "Target Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Clone and Prepare
        run: |
          git clone --depth 1 --branch ${{ env.VERSION }} https://github.com/Genymobile/scrcpy.git
          
          # 关键修正：源码中不包含 Server 文件，必须手动下载官方预编译的 Server
          # 这样可以避免在 CI 中配置复杂的 Java/Android SDK 环境
          SERVER_URL="https://github.com/Genymobile/scrcpy/releases/download/${{ env.VERSION }}/scrcpy-server-${{ env.VERSION }}"
          echo "Downloading Server from: $SERVER_URL"
          wget -O scrcpy-server "$SERVER_URL"

      - name: Build Client
        run: |
          cd scrcpy
          # 使用 Meson 编译客户端
          meson setup build --buildtype=release --strip -Db_lto=true
          ninja -C build

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/scrcpy
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/applications

          # 1. 复制编译好的客户端
          cp scrcpy/build/app/scrcpy AppDir/usr/bin/

          # 2. 复制下载的服务端
          cp scrcpy-server AppDir/usr/share/scrcpy/scrcpy-server

          # 3. 复制图标
          cp scrcpy/app/data/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/scrcpy.png

          # 4. 创建 Desktop 文件 (使用 printf 避免 YAML 缩进错误)
          printf "[Desktop Entry]\nType=Application\nName=Scrcpy\nExec=scrcpy\nIcon=scrcpy\nCategories=Development;Utility;\nTerminal=false\n" > AppDir/usr/share/applications/scrcpy.desktop

      - name: Package with LinuxDeploy
        run: |
          wget -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          
          # 打包
          ./linuxdeploy --appdir AppDir --output appimage

          # 重命名文件，带上版本号
          mv Scrcpy-*.AppImage Scrcpy-${{ env.VERSION }}-x86_64.AppImage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scrcpy-AppImage
          path: "Scrcpy-*.AppImage" # 这里加上了引号，修复了之前的通配符报错

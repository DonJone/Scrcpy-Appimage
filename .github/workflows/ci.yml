name: Build and Release Scrcpy AppImage

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # 每天 UTC 时间 2:00 自动检查更新

permissions:
  contents: write # 必须开启此权限，允许 Action 自动创建 Release

jobs:
  check-and-build:
    runs-on: ubuntu-22.04 # 使用 22.04 环境更现代
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Latest Scrcpy Version
        id: get_version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/Genymobile/scrcpy/releases/latest | jq -r .tag_name)
          echo "Target Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check if Release Exists
        id: check_release
        run: |
          # 检查该版本的 Release 是否已经存在，避免每天重复打包
          if gh release view ${{ env.VERSION }} > /dev/null 2>&1; then
            echo "Release ${{ env.VERSION }} already exists. Skipping build."
            echo "SKIP_BUILD=true" >> $GITHUB_ENV
          else
            echo "SKIP_BUILD=false" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        if: env.SKIP_BUILD == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg libsdl2-2.0-0 adb gcc git pkg-config meson ninja-build \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libavdevice-dev \
            libsdl2-dev libusb-1.0-0-dev python3-pip wget jq

      - name: Clone and Prepare
        if: env.SKIP_BUILD == 'false'
        run: |
          git clone --depth 1 --branch ${{ env.VERSION }} https://github.com/Genymobile/scrcpy.git
          SERVER_URL="https://github.com/Genymobile/scrcpy/releases/download/${{ env.VERSION }}/scrcpy-server-${{ env.VERSION }}"
          echo "Downloading Server from: $SERVER_URL"
          wget -O scrcpy-server "$SERVER_URL"

      - name: Build Client (Portable Mode)
        if: env.SKIP_BUILD == 'false'
        run: |
          cd scrcpy
          # 关键修正：必须启用 portable 模式！避免去系统 /usr/share 下寻找 server
          meson setup build --buildtype=release --strip -Db_lto=true -Dcompile_server=false -Dprebuilt_server=../scrcpy-server
          ninja -C build

      - name: Create AppDir & Package
        if: env.SKIP_BUILD == 'false'
        run: |
          # 按照 README 的理念，使用原生 appimagetool 保持轻量化
          mkdir -p Scrcpy.AppDir/usr/bin
          mkdir -p Scrcpy.AppDir/usr/share/applications
          mkdir -p Scrcpy.AppDir/usr/share/icons/hicolor/256x256/apps

          # 1. 复制客户端和服务端 (Portable 模式要求两者在同一目录或规范层级内)
          cp scrcpy/build/app/scrcpy Scrcpy.AppDir/usr/bin/
          cp scrcpy-server Scrcpy.AppDir/usr/bin/scrcpy-server

          # 2. 复制图标
          cp scrcpy/app/data/icon.png Scrcpy.AppDir/scrcpy.png
          cp scrcpy/app/data/icon.png Scrcpy.AppDir/usr/share/icons/hicolor/256x256/apps/scrcpy.png

          # 3. 创建 Desktop 文件
          cat > Scrcpy.AppDir/scrcpy.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Scrcpy
          Exec=scrcpy
          Icon=scrcpy
          Categories=Development;Utility;
          Terminal=false
          EOF

          # 4. 创建 AppRun 引导脚本
          cat > Scrcpy.AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export SCRCPY_SERVER_PATH="${HERE}/usr/bin/scrcpy-server"
          exec scrcpy "$@"
          EOF
          chmod +x Scrcpy.AppDir/AppRun

          # 5. 下载 appimagetool 并打包
          wget -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          
          # 注意：GitHub Actions 容器缺少 FUSE，需解压后运行避免报错
          ./appimagetool --appimage-extract
          export ARCH=x86_64
          ./squashfs-root/AppRun Scrcpy.AppDir Scrcpy-${{ env.VERSION }}-x86_64.AppImage

      - name: Upload Artifact
        if: env.SKIP_BUILD == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: Scrcpy-AppImage-${{ env.VERSION }}
          path: "Scrcpy-*.AppImage"

      - name: Create GitHub Release
        if: env.SKIP_BUILD == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Scrcpy AppImage ${{ env.VERSION }}"
          body: "Automated lightweight AppImage build for Scrcpy ${{ env.VERSION }}. \n\n**Note**: Please ensure `ffmpeg`, `SDL2`, and `adb` are installed on your host system."
          files: "Scrcpy-*.AppImage"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

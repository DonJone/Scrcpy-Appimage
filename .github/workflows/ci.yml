name: Build and Release Scrcpy All-in-One

on:
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新构建并覆盖发布'
        type: boolean
        default: true
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Latest Scrcpy Version
        id: get_version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/Genymobile/scrcpy/releases/latest | jq -r .tag_name)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check if Release Exists
        id: check_release
        run: |
          if [ "${{ github.event.inputs.force }}" == "true" ]; then
            echo "SKIP_BUILD=false" >> $GITHUB_ENV
          elif gh release view ${{ env.VERSION }} > /dev/null 2>&1; then
            echo "SKIP_BUILD=true" >> $GITHUB_ENV
          else
            echo "SKIP_BUILD=false" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        if: env.SKIP_BUILD == 'false'
        run: |
          # 1. 引入第三方 PPA 仓库 (提供最新的 FFmpeg)
          sudo add-apt-repository -y ppa:ubuntuhandbook1/ffmpeg7

          # 2. 更新软件源
          sudo apt-get update

          # 3. 安装依赖项 (SDL3 编译构建所需)
          sudo apt-get install -y \
            ffmpeg adb gcc git pkg-config meson ninja-build \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libavdevice-dev \
            libusb-1.0-0-dev libasound2-dev libpulse-dev libwayland-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev \
            libxkbcommon-dev libgl1-mesa-dev libxss-dev libxt-dev libxtst-dev libxv-dev \
            libxxf86vm-dev libdrm-dev libgbm-dev libdbus-1-dev libdecor-0-dev \
            libudev-dev libfribidi-dev libibus-1.0-dev libv4l-dev python3-pip wget jq unzip

      - name: Build and Install SDL3
        if: env.SKIP_BUILD == 'false'
        run: |
          git clone --depth 1 --branch release-3.4.8 https://github.com/libsdl-org/SDL.git
          cd SDL
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TEST=OFF \
            -DSDL_STATIC=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Clone and Prepare
        if: env.SKIP_BUILD == 'false'
        run: |
          git clone --depth 1 --branch ${{ env.VERSION }} https://github.com/Genymobile/scrcpy.git
          wget -O scrcpy-server "https://github.com/Genymobile/scrcpy/releases/download/${{ env.VERSION }}/scrcpy-server-${{ env.VERSION }}"
          
          # --- 下载最新官方 ADB ---
          wget -O platform-tools.zip https://dl.google.com/android/repository/platform-tools-latest-linux.zip
          unzip platform-tools.zip

      - name: Extract Component Versions
        if: env.SKIP_BUILD == 'false'
        run: |
          # 动态获取 FFmpeg 和 ADB 的精确版本号，并写入 GitHub 环境变量
          FFMPEG_VER=$(ffmpeg -version | head -n1 | awk '{print $3}')
          ADB_VER=$(platform-tools/adb version | awk '/^Version/ {print $2}')
          
          echo "FFMPEG_VER=$FFMPEG_VER" >> $GITHUB_ENV
          echo "ADB_VER=$ADB_VER" >> $GITHUB_ENV
          echo "抓取到的版本: FFmpeg=$FFMPEG_VER, ADB=$ADB_VER"

      - name: Build Client
        if: env.SKIP_BUILD == 'false'
        run: |
          cd scrcpy
          meson setup build --buildtype=release --strip -Db_lto=true -Dcompile_server=false -Dprebuilt_server=../scrcpy-server
          ninja -C build

      - name: Create AppDir & Package
        if: env.SKIP_BUILD == 'false'
        run: |
          mkdir -p Scrcpy.AppDir/usr/bin
          
          # 1. 复制 Scrcpy 组件
          cp scrcpy/build/app/scrcpy Scrcpy.AppDir/usr/bin/
          cp scrcpy-server Scrcpy.AppDir/usr/bin/scrcpy-server
          cp scrcpy/app/data/icon.png Scrcpy.AppDir/scrcpy.png
          
          # 2. 复制最新 ADB 到 bin 目录
          cp platform-tools/adb Scrcpy.AppDir/usr/bin/adb
          chmod +x Scrcpy.AppDir/usr/bin/adb
          
          # 3. 创建桌面文件
          cat > Scrcpy.AppDir/scrcpy.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Scrcpy
          Exec=scrcpy.wrapper
          Icon=scrcpy
          Categories=Development;Utility;
          Terminal=false
          EOF

          # 4. 引导脚本：确保 AppImage 内部的 ADB 优先级最高
          cat > Scrcpy.AppDir/usr/bin/scrcpy.wrapper << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="$APPDIR/usr/bin:$PATH"
          export SCRCPY_SERVER_PATH="$APPDIR/usr/bin/scrcpy-server"
          export LD_LIBRARY_PATH="$APPDIR/usr/lib/x86_64-linux-gnu:$APPDIR/usr/lib:$LD_LIBRARY_PATH"
          exec "$APPDIR/usr/bin/scrcpy" "$@"
          EOF
          chmod +x Scrcpy.AppDir/usr/bin/scrcpy.wrapper

          # 5. 下载 linuxdeploy 并执行
          wget -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          export ARCH=x86_64
          export VERSION="${{ env.VERSION }}"
          
          ./linuxdeploy --appimage-extract
          ./squashfs-root/AppRun \
            --appdir Scrcpy.AppDir \
            --executable Scrcpy.AppDir/usr/bin/scrcpy \
            --executable Scrcpy.AppDir/usr/bin/adb \
            --desktop-file Scrcpy.AppDir/scrcpy.desktop \
            --icon-file Scrcpy.AppDir/scrcpy.png \
            --output appimage

      - name: Create GitHub Release
        if: env.SKIP_BUILD == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Scrcpy AppImage ${{ env.VERSION }}"
          body: |
            ### Release Notes
            - **FFmpeg**: ${{ env.FFMPEG_VER }}
            - **Standalone ADB**: ${{ env.ADB_VER }}
          files: "Scrcpy-*.AppImage"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}